apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-deployment
  namespace: car-rental

spec:
  replicas: 3

  selector:
    matchLabels:
      app: devops-app

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      containers:
        - name: devops-container
          image: velishalaramm/car-rentals:v1
          ports:
            - containerPort: 80
